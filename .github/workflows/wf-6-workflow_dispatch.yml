name: Test workflow_dispatch
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true
jobs:
  test_workflowdispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Print the workflow inputs
        run: |
          echo "Log level : ${{ inputs.logLevel }}"
          echo "Environment : ${{ inputs.environment }}"
